<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CoverFlow</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><meta name="theme-color" content="#090909"><style> *{box-sizing:border-box}body{background:#090909;color:#eee;font:16px system-ui;text-align:center;margin:0}header{padding:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}button,select,a{background:#222;color:white;border:1px solid #555;border-radius:8px;padding:10px;text-decoration:none;cursor:pointer}#stage{height:min(53vh,430px);position:relative;perspective:1000px;overflow:hidden;touch-action:pan-y} .cover{position:absolute;left:50%;top:5%;width:min(35vw,36vh,280px);aspect-ratio:1;transition:transform .3s;cursor:pointer} .cover img{width:100%;display:block;border-radius:3px} .cover img.reflection{position:absolute;top:calc(100% - 1px);left:0;transform:scaleY(-1);opacity:.19;border-radius:0;pointer-events:none;-webkit-mask-image:linear-gradient(to top,rgba(0,0,0,.85) 0%,rgba(0,0,0,.48) 12%,rgba(0,0,0,.16) 28%,transparent 48%);mask-image:linear-gradient(to top,rgba(0,0,0,.85) 0%,rgba(0,0,0,.48) 12%,rgba(0,0,0,.16) 28%,transparent 48%)} #info{min-height:80px;padding:0 12px 8px}#album-title{font-size:23px;font-weight:600;line-height:1.25}#album-artist{font-size:17px;margin-top:4px;color:#ddd}#album-year{font-size:14px;color:#999;margin-top:3px}footer{padding:12px 10px 18px}footer button{font-size:12px;padding:6px 10px;color:#999;background:transparent;border-color:#333} [hidden]{display:none!important}#status{white-space:pre-wrap;padding:10px;color:#bbb}h1{font-weight:400;letter-spacing:4px;display:flex;align-items:center;justify-content:center;gap:12px}#tracks{max-height:25vh;overflow:auto;margin:10px auto;max-width:500px} </style><h1><img src="icon-192.png" alt="" width="44" height="44">CoverFlow</h1><header><select id="sort"><option value="artist">Interpret</option><option value="name">Album</option><option value="date">Erscheinungsjahr</option></select><button id="random">Zufall</button><button id="full">Vollbild</button></header><div id="status">Verbinde deine Spotify-Bibliothek.</div><div id="stage"></div><div id="info"><div id="album-title"></div><div id="album-artist"></div><div id="album-year"></div></div><button id="prev">◀</button> <span id="count"></span> <button id="next">▶</button><p><a id="open" hidden target="_blank" rel="noopener">In Spotify öffnen</a></p><div id="tracks"></div><footer><button id="login">Mit Spotify verbinden</button><button id="logout" hidden>Abmelden</button></footer><script>
const $=id=>document.getElementById(id),client_id='5028d9a563bd46fcac6f6fe7c731219b',appHome=new URL('./',location.href).href,redirect_uri=location.hostname==='127.0.0.1'?location.origin+'/callback':appHome;let albums=[],i=0,token='',refresh='',expiry=0;const b64=a=>btoa(String.fromCharCode(...a)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');const random=()=>b64(crypto.getRandomValues(new Uint8Array(48)));function status(s){$('status').textContent=s}async function login(){let v=random(),state=random();sessionStorage.setItem('v',v);sessionStorage.setItem('state',state);let challenge=b64(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v))));location.href='https://accounts.spotify.com/authorize?'+new URLSearchParams({client_id,redirect_uri,response_type:'code',scope:'user-library-read',state,code_challenge:challenge,code_challenge_method:'S256'})}async function exchange(p){let r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',body:new URLSearchParams({...p,client_id})});let d=await r.json();if(!r.ok)throw Error(d.error_description||d.error);token=d.access_token;refresh=d.refresh_token||refresh;expiry=Date.now()+d.expires_in*1000;localStorage.setItem('auth',JSON.stringify({token,refresh,expiry}))}async function api(url){if(Date.now()>expiry-30000&&refresh)await exchange({grant_type:'refresh_token',refresh_token:refresh});let r=await fetch(url,{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw Error('Spotify HTTP '+r.status+' – '+(await r.text()));return r.json()}async function load(){status('Alben werden geladen …');albums=[];let url='https://api.spotify.com/v1/me/albums?limit=20';while(url){let d=await api(url);albums.push(...d.items.map(x=>x.album).filter(Boolean));url=d.next;status(albums.length+' Alben geladen …')}sort();status(albums.length+' gespeicherte Alben · Cover antippen für Titelliste')}function sort(){let k=$('sort').value;let val=a=>k==='artist'?a.artists.map(x=>x.name).join(', '):k==='date'?a.release_date:a.name;albums.sort((a,b)=>String(val(a)).localeCompare(String(val(b)),'de'));i=0;render()}function render(){let s=$('stage');s.replaceChildren();$('tracks').replaceChildren();let a=albums[i];if(!a)return;let w=Math.min(innerWidth*.35,innerHeight*.36,280);for(let j=Math.max(0,i-5);j<=Math.min(albums.length-1,i+5);j++){let d=j-i,c=document.createElement('div');c.className='cover';c.style.transform=`translateX(-50%) translateX(${d*w*.48+(d?Math.sign(d)*w*.26:0)}px) translateZ(${d?-65-Math.abs(d)*20:25}px) rotateY(${-Math.sign(d)*53}deg)`;c.style.zIndex=20-Math.abs(d);let img=document.createElement('img');img.src=albums[j].images?.[0]?.url||'';img.alt=albums[j].name;c.append(img);let refl=img.cloneNode();refl.className='reflection';refl.alt='';c.append(refl);c.onclick=()=>{if(j===i)tracks();else{i=j;render()}};s.append(c)}$('album-title').textContent=a.name;$('album-artist').textContent=a.artists.map(x=>x.name).join(', ');$('album-year').textContent=a.release_date?.slice(0,4)||'';$('count').textContent=(i+1)+' / '+albums.length;$('open').href=a.external_urls.spotify;$('open').hidden=false}async function tracks(){try{let el=$('tracks');if(el.childNodes.length){el.replaceChildren();return}let a=albums[i],t=a.tracks||await api('https://api.spotify.com/v1/albums/'+a.id+'/tracks?limit=20');let items=[...t.items];while(t.next){t=await api(t.next);items.push(...t.items)}if(albums[i]!==a)return;for(let tr of items){let p=document.createElement('div');p.textContent=tr.track_number+' · '+tr.name;el.append(p)}}catch(e){status(e.message)}}function move(d){i=Math.max(0,Math.min(albums.length-1,i+d));render()}$('login').onclick=()=>login().catch(e=>status(e.message));$('logout').onclick=()=>{sessionStorage.clear();localStorage.removeItem('auth');location.href=appHome};$('sort').onchange=sort;$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('random').onclick=()=>{i=Math.floor(Math.random()*albums.length);render()};$('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});let x;$('stage').addEventListener('touchstart',e=>x=e.touches[0].clientX,{passive:true});$('stage').addEventListener('touchend',e=>{let d=e.changedTouches[0].clientX-x;if(Math.abs(d)>30)move(d<0?1:-1)});// CoverFlow 0.4: wheel and trackpad navigation
let wheelSum=0,lastWheel=0,lastStep=0;
$('stage').addEventListener('wheel',e=>{
  if(e.ctrlKey || !albums.length)return;
  e.preventDefault();
  const now=performance.now();
  let delta=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;
  delta*=e.deltaMode===1?40:e.deltaMode===2?innerHeight:1;
  if(!delta)return;
  if(now-lastWheel>180 || Math.sign(delta)!==Math.sign(wheelSum))wheelSum=0;
  lastWheel=now;
  wheelSum+=delta;
  if(Math.abs(wheelSum)>=40 && now-lastStep>=110){
    move(Math.sign(wheelSum));wheelSum=0;lastStep=now;
  }
},{passive:false});
addEventListener('resize',render);(async()=>{try{let p=new URLSearchParams(location.search);if(p.has('error'))throw Error(p.get('error'));if(p.has('code')){if(!p.get('state')||p.get('state')!==sessionStorage.getItem('state'))throw Error('Anmeldung ungültig');await exchange({grant_type:'authorization_code',code:p.get('code'),redirect_uri,code_verifier:sessionStorage.getItem('v')});sessionStorage.removeItem('v');sessionStorage.removeItem('state');history.replaceState({},'', appHome)}else if(localStorage.getItem('auth'))({token,refresh,expiry}=JSON.parse(localStorage.getItem('auth')));if(token){$('login').hidden=true;$('logout').hidden=false;await load()}}catch(e){status(e.message);$('login').hidden=false;$('logout').hidden=!token}})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(console.warn);
</script></html>
